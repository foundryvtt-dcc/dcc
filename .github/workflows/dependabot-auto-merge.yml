# Automatically merge Dependabot PRs once required checks pass.
#
# Uses GitHub's native auto-merge, so the PR only lands after the
# branch-protection required checks (Run Tests) are green. Requires the
# repository setting "Allow auto-merge" to be enabled; if it is not,
# the workflow falls back to leaving the PR for manual review.
name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'foundryvtt-dcc/dcc'
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

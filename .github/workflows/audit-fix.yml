# Daily security audit with automatic fix PRs (pnpm edition).
#
# Dependabot security updates cover direct dependencies it can bump, but
# transitive vulnerabilities (or advisories Dependabot skips) can slip
# through. This workflow runs `pnpm audit --fix` at the workspace root
# (which covers the e2e package too — one lockfile) and, if that produces
# changes that still pass the unit tests, opens (or updates) a PR on the
# fixed branch `automated/npm-audit-fix`. If the tree is clean no PR is
# created and any existing one is left to close on its own.
#
# pnpm semantics differ from npm: `pnpm audit --fix` does NOT bump the
# lockfile directly — it writes version *overrides* into package.json's
# pnpm.overrides, and the follow-up `pnpm install` realizes them in
# pnpm-lock.yaml. Overrides pin transitive versions permanently, so when
# an upstream release makes one redundant it should be removed (check on
# review of these PRs). The npm-era #877 false-trigger (release version
# bumps re-syncing package-lock.json) cannot happen here: `npm version`
# never touches pnpm-lock.yaml.
#
# Note: PRs opened with the default GITHUB_TOKEN do not trigger the
# "Run Tests" workflow, so the unit tests are run here before the PR is
# created instead. If "Run Tests" is ever made a required status check
# on main, these PRs will sit at "Expected — waiting for status" and
# need an admin merge (or switch the `token` input of the
# create-pull-request step to a PAT/GitHub App token so CI triggers).
name: Audit Fix

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    if: github.repository == 'foundryvtt-dcc/dcc'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and fix (workspace-wide)
        run: |
          pnpm audit || true
          pnpm audit --fix || true
          # Realize any new overrides into the lockfile.
          #
          # --config.minimumReleaseAge=0 deliberately suspends the 7-day
          # supply-chain quarantine from pnpm-workspace.yaml for this one
          # install. The quarantine is unconditional — pnpm has no notion of
          # "this is a security fix, let it through" — so without the bypass a
          # freshly published fix would be refused with
          # ERR_PNPM_NO_MATURE_MATCHING_VERSION and this job could never
          # produce a PR for exactly the advisories that matter most.
          #
          # Suspending it here is safe because a human reviews the resulting
          # PR. It is NOT safe to copy this flag into run-tests.yml or a local
          # workflow: that is where the quarantine does its real work.
          # (Env vars and --minimum-release-age do not work; only
          # --config.<key> is honoured.)
          pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml browser-tests/e2e/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Run unit tests against fixed dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      - name: Create or update fix PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/npm-audit-fix
          delete-branch: true
          commit-message: 'fix(deps): apply pnpm audit fixes for security vulnerabilities'
          title: 'fix(deps): apply pnpm audit fixes for security vulnerabilities'
          body: |
            Automated `pnpm audit --fix` for vulnerabilities not covered by an
            open Dependabot PR, applied workspace-wide (root +
            `/browser-tests/e2e` share one lockfile).

            **Review note:** fixes land as `pnpm.overrides` entries in
            package.json, which pin the affected transitive versions
            permanently. When the upstream dependency ships a release that
            makes an override redundant, remove the override in a follow-up.

            **Review note:** if the fix pulls in a version published less
            than 7 days ago, CI on this PR will fail with
            `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` — the lockfile is
            re-verified against the quarantine on every install. That failure
            is a prompt, not a bug: decide whether the fresh release is worth
            taking, and if so add the exact `package@version` to
            `minimumReleaseAgeExclude` in `pnpm-workspace.yaml` in this PR,
            then remove that entry once the version ages past a week.

            The unit test suite (`pnpm test`) passed against the updated
            dependencies before this PR was opened. See the workflow run for
            the audit report and diff summary.

            _Opened automatically by the Audit Fix workflow._

<label class="term-label" for="term-{{index}}" data-tooltip="{{hint}}">{{label}}</label>
<input class="term-field" name="term-{{index}}" id="term-{{index}}" placeholder="{{checkedFormula}}" value="{{#if startsChecked}}{{formula}}{{/if}}"/>
<div class="term-controls check-penalty-controls">
  <label class="checkbox-label" for="check-penalty" data-tooltip="{{hint}}">{{localize 'DCC.RollModifierCheckPenaltyApply'}}</label>
  <input type="checkbox" data-action="checkboxChange" id="check-penalty" data-term="{{index}}"
         {{#if startsChecked}}checked{{/if}}/>
</div>

<section class="hit-points-config grid-container grid-row-gap-8 p-8">
  <div class="hp-display grid-col-span-12">
    <span class="hp-current">{{hp}}</span>
    <span class="hp-separator">/</span>
    <span class="hp-max">{{maxHp}}</span>
  </div>

  <label class="grid-col-span-12" for="adjustment">{{localize "DCC.HitPointsAdjustment"}}</label>
  <input class="grid-col-span-10" type="text" name="adjustment" id="adjustment" value="" placeholder="-3 or +3">
  <button class="grid-col-span-2" type="submit" title="{{localize 'DCC.Apply'}}">
    <i class="fas fa-check"></i>
  </button>

  <p class="grid-col-span-12 hint">{{localize "DCC.HitPointsHint"}}</p>

  {{#if trackSubdual}}
  <label class="grid-col-span-8" for="subdual" title="{{localize 'DCC.SubdualDamageTotalHint'}}">{{localize "DCC.SubdualDamage"}}</label>
  <input class="grid-col-span-4" type="number" name="subdual" id="subdual" value="{{subdual}}" min="0" step="1">
  {{/if}}

  <fieldset class="natural-healing grid-col-span-12 grid-container grid-row-gap-4">
    <legend>{{localize "DCC.NaturalHealing"}}</legend>
    <label class="grid-col-span-8" for="restDays">{{localize "DCC.NaturalHealingDays"}}</label>
    <input class="grid-col-span-4" type="number" name="restDays" id="restDays" value="1" min="1" step="1">
    <button class="grid-col-span-6" type="button" data-action="rest" data-rest-type="active-adventure" data-tooltip="{{nightsRestHint}}">
      <i class="fas fa-moon"></i> {{localize "DCC.NaturalHealingNight"}}
    </button>
    <button class="grid-col-span-6" type="button" data-action="rest" data-rest-type="bed-rest" data-tooltip="{{bedRestHint}}">
      <i class="fas fa-bed"></i> {{localize "DCC.NaturalHealingBedRest"}}
    </button>
  </fieldset>
</section>
